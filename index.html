
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Sales Log · Styled</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>
    
    <div class="app-container">
        <h1>Daily Sales Log</h1>
        <div class="subhead">Add sales entries & track total instantly</div>
    
    <button id="add-sales-btn">Add Sales for the day</button>

    <div id="sales-cards"></div>

    <div class="input-groups">
        <button class="back-btn"><i class="fa-solid fa-arrow-left-long"></i> Back</button>
    <div class="input-group">
        <input type="text" placeholder="Description" id="sales-input">
        <input type="number" placeholder="Amount" id="amount" step="any">
        <button id="add-btn">Add Sales</button>
    </div>
    <div id="items"></div>
    </div>
    </div>
</body>
<script src="script.js"></script>
</html>
